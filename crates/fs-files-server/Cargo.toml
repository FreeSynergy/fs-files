[package]
name = "fs-files-server"
description = "Cap'n Proto server of FreeSynergy files: the contract files.capnp over a Unix socket, in front of any Files, Transfer, Backends and FileFeed provider"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "fs_files_server"

[dependencies]
fs-files-core = { path = "../fs-files-core" }
fs-files-types = { path = "../fs-files-types" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.18", features = ["rpc"] }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(windows)'.dev-dependencies]
# Links in the tests: a junction is the folder link of Windows (no right needed).
junction = "1"

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
uuid = "1"
tokio = { version = "1", features = ["full"] }
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
