[package]
name = "fs-files-server"
description = "Cap'n Proto server of FreeSynergy files: the contract files.capnp over a Unix socket, in front of any Files, Transfer, Backends and FileFeed provider"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "fs_files_server"

[[bin]]
name = "fs-files-server"
path = "src/main.rs"

[dependencies]
fs-files-core = { path = "../fs-files-core" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.33.0", features = ["rpc"] }
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
uuid = "1"
tokio = { version = "1", features = ["full"] }
