[package]
name = "fs-files-client"
description = "Client of the files contract (files.capnp): Files and Transfer of fs-files-core over a Unix socket"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-files-core = { path = "../fs-files-core", default-features = false }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.1", features = ["rpc"] }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
capnp = "0.27"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
fs-files-server = { path = "../fs-files-server" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
