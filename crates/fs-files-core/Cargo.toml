[package]
name = "fs-files-core"
description = "Program core of FreeSynergy files: metadata in fs-store, bytes behind swappable backends (local folder, S3)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["s3"]
# The S3 backend (RustFS and any S3 store).
s3 = ["dep:object_store", "dep:bytes"]

[dependencies]
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.8.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt"] }
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
infer = { version = "0.22", default-features = false, features = ["std"] }
# S3 client with the low-level multipart API (MultipartStore). Optional: a build without S3 stays free of TLS and C code.
object_store = { version = "0.14", default-features = false, features = ["aws"], optional = true }
bytes = { version = "1", optional = true }

# Atomic "rename, but never replace" (renameat2 NOREPLACE): `std::fs::rename` replaces its target.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
