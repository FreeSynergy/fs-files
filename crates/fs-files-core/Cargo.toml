[package]
name = "fs-files-core"
description = "Program core of FreeSynergy files: metadata in fs-store, bytes behind swappable backends (local folder, S3)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt"] }
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
infer = { version = "0.22", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
