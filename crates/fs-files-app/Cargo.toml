[package]
name = "fs-files-app"
description = "The files program of FreeSynergy, window: the generated Admin frontend over the Cap'n Proto socket, in the standard window shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-files-types = { path = "../fs-files-types" }
fs-types = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.2" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.16", features = ["rpc"] }
fs-admin-frontend = { git = "https://github.com/FreeSynergy/fs-components", rev = "4688cee" }
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", rev = "4688cee" }
fs-components-fields = { git = "https://github.com/FreeSynergy/fs-components", rev = "4688cee" }
fs-components-styles = { git = "https://github.com/FreeSynergy/fs-components", rev = "4688cee" }
capnp = "0.27"
uuid = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
fs-files-core = { path = "../fs-files-core" }
fs-files-server = { path = "../fs-files-server" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
