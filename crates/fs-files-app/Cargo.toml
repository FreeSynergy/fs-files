[package]
name = "fs-files-app"
description = "The files program of FreeSynergy, first window: folders, list and grid, sort, filter, search, trash, transfers, rescan; on fs-components"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.89"

[dependencies]
fs-files-core = { path = "../fs-files-core" }
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.28.0" }
# provisional: becomes a tag once reviewed
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", rev = "19b6d0df2ae1dd8b8f2d40c7604c27932e18a75e" }
# provisional: becomes a tag once reviewed
fs-components-workbenches = { git = "https://github.com/FreeSynergy/fs-components", rev = "19b6d0df2ae1dd8b8f2d40c7604c27932e18a75e" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
# provisional: becomes a tag once reviewed
fs-components-render = { git = "https://github.com/FreeSynergy/fs-components", rev = "19b6d0df2ae1dd8b8f2d40c7604c27932e18a75e" }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
