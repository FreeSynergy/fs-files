name: release
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write
jobs:
  release:
    uses: FreeSynergy/fs-release/.github/workflows/release.yml@main
    with:
      binaries: fs-files
      cargo-package: fs-files
      name: fs-files
      kind: app
      app-id: net.freesynergy.Files
      macos: false
      windows-targets: "x86_64"   # the disk parts (names, durability, moves) and the process parts have a Windows implementation; the gate runs on windows-2022
      windows-formats: "zip,exe"
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
